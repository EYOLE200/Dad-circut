<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/L.Control.Locate.min.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet-search.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <link rel="stylesheet" href="css/leaflet-measure.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/L.Control.Locate.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script src="js/leaflet-search.js"></script>
        <script src="data/DirectionYaoundeDja_2.js"></script>
        <script src="data/MainLocality_3.js"></script>
        <script src="data/Base_4.js"></script>
        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;
            highlightLayer.openPopup();
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        })
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // add class to format popup if it contains media
		function addClassToPopupIfMedia(content, popup) {
			var tempDiv = document.createElement('div');
			tempDiv.innerHTML = content;
			if (tempDiv.querySelector('td img')) {
				popup._contentNode.classList.add('media');
					// Delay to force the redraw
					setTimeout(function() {
						popup.update();
					}, 10);
			} else {
				popup._contentNode.classList.remove('media');
			}
		}
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
            if (bounds_group.getLayers().length) {
                map.fitBounds(bounds_group.getBounds());
            }
            map.setMaxBounds(map.getBounds());
        }
        map.createPane('pane_EsriSatellite_0');
        map.getPane('pane_EsriSatellite_0').style.zIndex = 400;
        var layer_EsriSatellite_0 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            pane: 'pane_EsriSatellite_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 17
        });
        layer_EsriSatellite_0;
        map.addLayer(layer_EsriSatellite_0);
        map.createPane('pane_GoogleMaps_1');
        map.getPane('pane_GoogleMaps_1').style.zIndex = 401;
        var layer_GoogleMaps_1 = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleMaps_1',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        layer_GoogleMaps_1;
        map.addLayer(layer_GoogleMaps_1);
        function pop_DirectionYaoundeDja_2(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Id'] !== null ? autolinker.link(String(feature.properties['Id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Name'] !== null ? autolinker.link(String(feature.properties['Name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_DirectionYaoundeDja_2_0(feature) {
            switch(String(feature.properties['Name'])) {
                default:
                    return {
                pane: 'pane_DirectionYaoundeDja_2',
                opacity: 1,
                color: 'rgba(207,20,18,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 6.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
                case 'Feminbang road':
                    return {
                pane: 'pane_DirectionYaoundeDja_2',
                opacity: 1,
                color: 'rgba(91,169,101,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 6.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_DirectionYaoundeDja_2');
        map.getPane('pane_DirectionYaoundeDja_2').style.zIndex = 402;
        map.getPane('pane_DirectionYaoundeDja_2').style['mix-blend-mode'] = 'normal';
        var layer_DirectionYaoundeDja_2 = new L.geoJson(json_DirectionYaoundeDja_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_DirectionYaoundeDja_2',
            layerName: 'layer_DirectionYaoundeDja_2',
            pane: 'pane_DirectionYaoundeDja_2',
            onEachFeature: pop_DirectionYaoundeDja_2,
            style: style_DirectionYaoundeDja_2_0,
        });
        bounds_group.addLayer(layer_DirectionYaoundeDja_2);
        map.addLayer(layer_DirectionYaoundeDja_2);
        function pop_MainLocality_3(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['type_'] !== null ? autolinker.link(String(feature.properties['type_']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['nom_lieu'] !== null ? autolinker.link(String(feature.properties['nom_lieu']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Directives'] !== null ? autolinker.link(String(feature.properties['Directives']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_MainLocality_3_0() {
            return {
                pane: 'pane_MainLocality_3',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(164,113,88,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_MainLocality_3');
        map.getPane('pane_MainLocality_3').style.zIndex = 403;
        map.getPane('pane_MainLocality_3').style['mix-blend-mode'] = 'normal';
        var layer_MainLocality_3 = new L.geoJson(json_MainLocality_3, {
            attribution: '',
            interactive: true,
            dataVar: 'json_MainLocality_3',
            layerName: 'layer_MainLocality_3',
            pane: 'pane_MainLocality_3',
            onEachFeature: pop_MainLocality_3,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_MainLocality_3_0(feature));
            },
        });
        bounds_group.addLayer(layer_MainLocality_3);
        map.addLayer(layer_MainLocality_3);
        function pop_Base_4(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Id'] !== null ? autolinker.link(String(feature.properties['Id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Name'] !== null ? autolinker.link(String(feature.properties['Name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Base_4_0(feature) {
            switch(String(feature.properties['Name'])) {
                case 'Yaounde HO':
                    return {
                pane: 'pane_Base_4',
        rotationAngle: 0.0,
        rotationOrigin: 'center center',
        icon: L.icon({
            iconUrl: 'markers/Base_4.svg',
            iconSize: [25.84, 25.84]
        }),
                interactive: true,
            }
                    break;
                case 'Field Base':
                    return {
                pane: 'pane_Base_4',
        rotationAngle: 0.0,
        rotationOrigin: 'center center',
        icon: L.icon({
            iconUrl: 'markers/Base_4.svg',
            iconSize: [38.0, 38.0]
        }),
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_Base_4');
        map.getPane('pane_Base_4').style.zIndex = 404;
        map.getPane('pane_Base_4').style['mix-blend-mode'] = 'normal';
        var layer_Base_4 = new L.geoJson(json_Base_4, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Base_4',
            layerName: 'layer_Base_4',
            pane: 'pane_Base_4',
            onEachFeature: pop_Base_4,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.marker(latlng, style_Base_4_0(feature));
            },
        });
        bounds_group.addLayer(layer_Base_4);
        map.addLayer(layer_Base_4);
        var overlaysTree = [
            {label: 'Base<br /><table><tr><td style="text-align: center;"><img src="legend/Base_4_YaoundeHO0.png" /></td><td>Yaounde HO</td></tr><tr><td style="text-align: center;"><img src="legend/Base_4_FieldBase1.png" /></td><td>Field Base</td></tr></table>', layer: layer_Base_4},
            {label: '<img src="legend/MainLocality_3.png" /> Main Locality', layer: layer_MainLocality_3},
            {label: 'Direction (Yaounde-Dja)<br /><table><tr><td style="text-align: center;"><img src="legend/DirectionYaoundeDja_2_DirectroadYaoundeDja0.png" /></td><td>Direct road (Yaounde-Dja)</td></tr><tr><td style="text-align: center;"><img src="legend/DirectionYaoundeDja_2_ReturnroadthroughFegminbang1.png" /></td><td>Return road through Fegminbang</td></tr></table>', layer: layer_DirectionYaoundeDja_2},
            {label: "Google Maps", layer: layer_GoogleMaps_1},
            {label: "Esri Satellite", layer: layer_EsriSatellite_0},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: true,
        });
        lay.addTo(map);
        setBounds();
        var i = 0;
        layer_MainLocality_3.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((layer.feature.properties['nom_lieu'] !== null?String('<div style="color: #323232; font-size: 13pt; font-family: \'Open Sans\', sans-serif;">' + layer.feature.properties['nom_lieu']) + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_MainLocality_3'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        map.addControl(new L.Control.Search({
            layer: layer_MainLocality_3,
            initial: false,
            hideMarkerOnCollapse: true,
            propertyName: 'nom_lieu'}));
        if (typeof url === 'undefined') {
            document.getElementsByClassName('search-button')[0].className += ' fa fa-binoculars';
        } else {
            document.getElementsByClassName('search-button')[1].className += ' fa fa-binoculars';
        }
        resetLabels([layer_MainLocality_3]);
        map.on("zoomend", function(){
            resetLabels([layer_MainLocality_3]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_MainLocality_3]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_MainLocality_3]);
        });
        </script>
    </body>
</html>
